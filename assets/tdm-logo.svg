<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tdmGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00a3ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="tdmGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <radialGradient id="tdmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00a3ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00a3ff" stop-opacity="0" />
    </radialGradient>
    <filter id="tdmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00a3ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#tdmGlow)" />

  <!-- Outer Speed Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />
  <path d="M 256 46 A 210 210 0 0 1 440 360" fill="none" stroke="url(#tdmGrad1)" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 8" />
  <path d="M 120 420 A 210 210 0 0 1 70 200" fill="none" stroke="url(#tdmGrad2)" stroke-width="8" stroke-linecap="round" />

  <!-- Shield / Core Base -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="#121824" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" filter="url(#tdmShadow)" />
  
  <!-- Subtle Internal Grid -->
  <rect x="96" y="96" width="320" height="320" rx="56" fill="#0d1117" />

  <!-- High-Speed Dual Downward Velocity Chevrons -->
  <g transform="translate(256, 256)">
    <!-- Top Speed Chevron -->
    <path d="M -90 -80 L 0 -10 L 90 -80 L 50 -120 L 0 -75 L -50 -120 Z" fill="url(#tdmGrad2)" opacity="0.85" />
    
    <!-- Main Center Download Arrow -->
    <path d="M -100 -20 L 0 70 L 100 -20 L 60 -55 L 0 0 L -60 -55 Z" fill="url(#tdmGrad1)" />

    <!-- Leading High-Impact Downward Arrow Tip -->
    <path d="M -80 40 L 0 115 L 80 40 L 50 15 L 0 62 L -50 15 Z" fill="#00f5ff" />
    
    <!-- Pulse Base Plate / Floor Beam -->
    <rect x="-85" y="140" width="170" height="18" rx="9" fill="url(#tdmGrad1)" />
    <circle cx="0" cy="149" r="4" fill="#ffffff" />
    <circle cx="-50" cy="149" r="3" fill="#00f5ff" />
    <circle cx="50" cy="149" r="3" fill="#00f5ff" />
  </g>
</svg>
