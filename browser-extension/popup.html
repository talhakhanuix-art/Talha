<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TDM Integration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #00a3ff, #00f5ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.5px;
    }
    .title-area h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #ffffff;
    }
    .title-area p {
      font-size: 11px;
      color: #7d8590;
    }
    .card {
      background: #161f30;
      border: 1px solid rgba(0, 163, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      font-size: 12px;
      color: #c9d1d9;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: linear-gradient(135deg, #00a3ff, #00f5ff);
    }
    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #000;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 6px #3fb950;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn:hover {
      background: #30363d;
      border-color: #00a3ff;
      color: #ffffff;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #565f6c;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">TDM</div>
    <div class="title-area">
      <h1>Talha Download Manager</h1>
      <p>Fast. Smart. Always Free.</p>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Automatic Capture</span>
      <label class="switch">
        <input type="checkbox" id="toggleCapture" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row" style="margin-top: 10px;">
      <span class="label">Desktop Status</span>
      <div class="status-badge" id="statusBadge">
        <div class="status-dot"></div>
        <span>Connected</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Captured Downloads</span>
      <span style="font-weight: 700; color: #00f5ff;" id="capturedCount">0</span>
    </div>
  </div>

  <button class="btn" id="btnOpenTDM">Open Talha Download Manager</button>

  <div class="footer">
    Talha Download Manager Extension v1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
